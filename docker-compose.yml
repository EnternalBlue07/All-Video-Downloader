version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: mediaos-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - mediaos-storage:/app/mediaos_backend/storage
      - mediaos-downloads:/app/mediaos_backend/downloads
    environment:
      - MEDIAOS_HOST=0.0.0.0
      - MEDIAOS_PORT=8000
    networks:
      - mediaos-net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: mediaos-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - mediaos-net

volumes:
  mediaos-storage:
    driver: local
  mediaos-downloads:
    driver: local

networks:
  mediaos-net:
    driver: bridge
